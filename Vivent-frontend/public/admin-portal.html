<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIVENT Admin Portal</title>

  <!-- No index — prevent search engines from finding this page -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link href="/design-system.css" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 4% 5%, rgba(35, 66, 184, 0.10) 0, rgba(35, 66, 184, 0.10) 1px, transparent 28%),
        radial-gradient(circle at 96% 90%, rgba(35, 66, 184, 0.12) 0, transparent 31%),
        var(--vivent-page);
      padding: 1.5rem;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--vivent-surface);
      border: 1px solid rgba(217, 223, 232, 0.8);
      border-radius: var(--vivent-radius-xl);
      width: 100%;
      max-width: 420px;
      padding: 2.75rem;
      box-shadow: var(--vivent-shadow-card);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--vivent-blue-soft);
      border: 1px solid var(--vivent-blue-border);
      color: var(--vivent-blue);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 1.5rem;
    }
    .badge::before {
      content: '';
      width: 6px; height: 6px;
      background: var(--vivent-blue);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(1.75rem, 5vw, 2.125rem);
      font-weight: 700;
      color: var(--vivent-slate-950);
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-bottom: 0.625rem;
    }
    h1 .brand { color: var(--vivent-blue); }
    .subtitle {
      font-size: 0.875rem;
      color: var(--vivent-slate-500);
      line-height: 1.6;
      margin-bottom: 2.25rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--vivent-slate-700);
      margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      background: var(--vivent-surface);
      border: 1px solid var(--vivent-slate-300);
      border-radius: var(--vivent-radius-md);
      padding: 0.875rem 1rem;
      color: var(--vivent-slate-950);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 1.25rem;
    }
    input::placeholder { color: #9CA3AF; }
    input:focus {
      border-color: var(--vivent-blue);
      box-shadow: 0 0 0 3px rgba(35, 66, 184, 0.16);
    }

    button[type="submit"] {
      width: 100%;
      background: var(--vivent-blue);
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.875rem;
      border: none;
      border-radius: var(--vivent-radius-md);
      cursor: pointer;
      transition: background-color 0.2s, transform 0.15s, box-shadow 0.2s;
      margin-top: 0.25rem;
    }
    button[type="submit"]:hover { background: var(--vivent-blue-hover); transform: translateY(-1px); box-shadow: 0 8px 16px rgba(35, 66, 184, 0.22); }
    button[type="submit"]:active { transform: translateY(0); }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .error {
      background: var(--vivent-danger-soft);
      border: 1px solid #FECDCA;
      color: var(--vivent-danger);
      font-size: 0.85rem;
      padding: 0.75rem 1rem;
      border-radius: var(--vivent-radius-md);
      margin-top: 1rem;
      display: none;
    }

    .success-screen {
      text-align: center;
      display: none;
    }
    .check {
      width: 64px; height: 64px;
      background: var(--vivent-blue-soft);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      margin: 0 auto 1rem;
      border: 1px solid var(--vivent-blue-border);
    }
    .success-screen h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--vivent-slate-950);
      margin-bottom: 0.4rem;
    }
    .success-screen p {
      font-size: 0.875rem;
      color: var(--vivent-slate-500);
    }

    .warning {
      margin-top: 2rem;
      padding: 0.875rem 1rem;
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: 10px;
      font-size: 0.78rem;
      color: rgba(253,230,138,0.7);
      line-height: 1.5;
    }
    .warning strong { color: #fde68a; }

    @media (max-width: 480px) {
      body { align-items: flex-start; padding: 1rem; }
      .card { margin: 2rem 0; padding: 2rem 1.5rem; border-radius: 20px; }
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Login form -->
  <div id="login-section">
    <div class="badge">Restricted Access</div>
    <h1><span class="brand">VIVENT</span><br/>Admin Portal</h1>
    <!-- <p class="subtitle">This page is for authorized administrators only.<br/>Not linked from the public application.</p> -->

    <form id="admin-form" autocomplete="off">
      <label for="email">Admin Email</label>
      <input
        id="email"
        type="email"
        name="email"
        
        autocomplete="off"
        required
      />

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        name="password"
        
        autocomplete="new-password"
        required
      />

      <button type="submit" id="submit-btn">Sign in as Admin</button>

      <div class="error" id="error-box"></div>
    </form>

    <!-- Security warning -->
    <!-- <div class="warning">
      <strong>⚠ Security notice:</strong> This portal authenticates via the
      private backend endpoint and is not indexed by search engines.
      All sessions are server-validated on every request.
      Bookmark this page — do not share the URL.
    </div> -->
  </div>

  <!-- Success screen -->
  <div class="success-screen" id="success-section">
    <div class="check">✓</div>
    <h2>Authentication Successful</h2>
    <p>Redirecting to Admin Dashboard…</p>
  </div>

</div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────────
  // Change this to your deployed backend URL in production.
  const BACKEND = 'http://127.0.0.1:8000';
  // The private admin login endpoint (hidden from public OpenAPI docs).
  const ADMIN_LOGIN_PATH = '/auth/admin/login';
  // Where to redirect after a successful login.
  const REDIRECT_TO = '/adminpanel';

  // ── Form submission ──────────────────────────────────────────────────────────
  document.getElementById('admin-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn   = document.getElementById('submit-btn');
    const error = document.getElementById('error-box');

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled   = true;
    btn.textContent = 'Verifying…';
    error.style.display = 'none';

    try {
      const res = await fetch(`${BACKEND}${ADMIN_LOGIN_PATH}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.detail || `Server error ${res.status}`);
      }

      // Verify the returned role server-side claim.
      if (data.user?.role !== 'admin') {
        throw new Error('Access denied. This account does not have admin privileges.');
      }

      // Persist session — same keys the main app uses so AdminProtectedRoute works.
      localStorage.setItem('viventToken',    data.access_token);
      localStorage.setItem('viventAuth',     'true');
      localStorage.setItem('viventAuthRole', 'admin');
      localStorage.setItem('viventUser',     JSON.stringify(data.user));

      // Show success and redirect.
      document.getElementById('login-section').style.display  = 'none';
      document.getElementById('success-section').style.display = 'block';

      setTimeout(() => {
        window.location.href = REDIRECT_TO;
      }, 1200);

    } catch (err) {
      error.textContent    = err.message || 'Authentication failed.';
      error.style.display  = 'block';
      btn.disabled         = false;
      btn.textContent      = 'Sign in as Admin';
    }
  });
</script>

</body>
</html>
